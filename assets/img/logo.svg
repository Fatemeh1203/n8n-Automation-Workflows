<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Automation Studio">
  <defs>
    <radialGradient id="glowTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2fd8d0" stop-opacity=".85"/>
      <stop offset="45%" stop-color="#25b6bd" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#1a8f9c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9a8" stop-opacity=".95"/>
      <stop offset="40%" stop-color="#f5b731" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#f5b731" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="stemGrad" x1="10%" y1="90%" x2="95%" y2="15%">
      <stop offset="0%" stop-color="#2f6b32"/>
      <stop offset="22%" stop-color="#4f8f34"/>
      <stop offset="46%" stop-color="#d9b23c"/>
      <stop offset="62%" stop-color="#f3d878"/>
      <stop offset="80%" stop-color="#6f9a35"/>
      <stop offset="100%" stop-color="#356c33"/>
    </linearGradient>

    <linearGradient id="leafGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#5d8f4a"/>
      <stop offset="45%" stop-color="#3f6f38"/>
      <stop offset="100%" stop-color="#28502b"/>
    </linearGradient>

    <linearGradient id="leafEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d68a" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#c9a33c" stop-opacity=".35"/>
    </linearGradient>

    <radialGradient id="budGrad" cx="38%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fff6d5"/>
      <stop offset="35%" stop-color="#ffd75e"/>
      <stop offset="75%" stop-color="#e5a316"/>
      <stop offset="100%" stop-color="#b87908"/>
    </radialGradient>

    <linearGradient id="streakGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f7d271" stop-opacity="0"/>
      <stop offset="55%" stop-color="#ffe9a6" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#fff8e0" stop-opacity="0"/>
    </linearGradient>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="softer" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- teal halo behind the root -->
  <circle cx="196" cy="316" r="132" fill="url(#glowTeal)"/>
  <!-- gold halo behind the bud -->
  <circle cx="382" cy="352" r="86" fill="url(#glowGold)"/>

  <!-- light streak -->
  <path d="M256 300 L470 46" stroke="url(#streakGrad)" stroke-width="13" stroke-linecap="round" filter="url(#softer)"/>

  <!-- stem: hook at the left, arch to the right, bud at the end -->
  <path d="M232 176
           C232 214 226 244 214 268
           C198 300 176 316 178 340
           C180 364 216 368 222 344
           C226 328 214 318 202 322"
        fill="none" stroke="url(#stemGrad)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M236 246
           C268 226 316 226 348 258
           C378 288 380 318 380 336"
        fill="none" stroke="url(#stemGrad)" stroke-width="28" stroke-linecap="round"/>

  <!-- glossy highlight along the stem -->
  <path d="M240 250 C270 233 312 234 340 262" fill="none" stroke="#fff3c4" stroke-width="7" stroke-linecap="round" opacity=".65"/>
  <path d="M222 200 C218 226 212 248 203 266" fill="none" stroke="#fff3c4" stroke-width="6" stroke-linecap="round" opacity=".5"/>

  <!-- left leaf -->
  <g>
    <path d="M228 172 C196 150 168 116 166 74 C208 78 244 104 258 142 Z" fill="url(#leafGrad)"/>
    <path d="M228 172 C196 150 168 116 166 74" fill="none" stroke="url(#leafEdge)" stroke-width="5" stroke-linecap="round"/>
    <path d="M226 168 L176 88 M212 148 L188 140 M204 134 L184 122 M216 122 L200 100" stroke="#e8f0d8" stroke-width="2.6" opacity=".55" fill="none" stroke-linecap="round"/>
  </g>

  <!-- right leaf -->
  <g>
    <path d="M240 168 C252 124 288 88 336 76 C338 124 314 162 274 182 Z" fill="url(#leafGrad)"/>
    <path d="M240 168 C252 124 288 88 336 76" fill="none" stroke="url(#leafEdge)" stroke-width="5" stroke-linecap="round"/>
    <path d="M244 164 L326 88 M266 142 L292 134 M280 126 L302 116 M258 128 L276 106" stroke="#e8f0d8" stroke-width="2.6" opacity=".55" fill="none" stroke-linecap="round"/>
  </g>

  <!-- gold bud -->
  <g>
    <path d="M380 322 C412 322 428 346 424 370 C420 396 400 410 380 410 C360 410 340 396 336 370 C332 346 348 322 380 322 Z" fill="url(#budGrad)"/>
    <ellipse cx="366" cy="348" rx="13" ry="18" fill="#fffbe8" opacity=".75" transform="rotate(-18 366 348)"/>
    <path d="M380 326 L380 406" stroke="#b8820c" stroke-width="2.4" opacity=".45"/>
  </g>
  <circle cx="380" cy="366" r="30" fill="url(#glowGold)" filter="url(#soft)"/>

  <!-- sparks -->
  <g fill="#fff3c4" opacity=".9">
    <circle cx="150" cy="270" r="3.2"/>
    <circle cx="266" cy="380" r="2.6"/>
    <circle cx="442" cy="306" r="3"/>
    <circle cx="120" cy="352" r="2.4"/>
  </g>
</svg>
